<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EE; --bg-card:#FFFFFF; --bg-soft:#F1E8D8;
    --ink:#22302A; --ink-soft:#73827A;
    --accent:#3F7863; --accent-ink:#FFFFFF; --accent-warm:#D98A2B; --relapse:#B2564A;
    --line:#E5DAC3; --line-soft:#EFE7D6;
    --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
    --shadow:0 2px 10px rgba(34,48,42,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160F; --bg-card:#1B2118; --bg-soft:#20261C;
      --ink:#ECE9DF; --ink-soft:#9AA598;
      --accent:#6FAA8D; --accent-ink:#0F1510; --accent-warm:#E8B15C; --relapse:#D98277;
      --line:#2C3327; --line-soft:#242B20; --shadow:0 2px 14px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12160F; --bg-card:#1B2118; --bg-soft:#20261C;
    --ink:#ECE9DF; --ink-soft:#9AA598;
    --accent:#6FAA8D; --accent-ink:#0F1510; --accent-warm:#E8B15C; --relapse:#D98277;
    --line:#2C3327; --line-soft:#242B20; --shadow:0 2px 14px rgba(0,0,0,0.35);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:"Tajawal","Segoe UI",sans-serif; line-height:1.75; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:760px; margin:0 auto; padding:22px 16px 90px; }

  header.top{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; gap:12px; }
  header.top .brand{ display:flex; align-items:center; gap:12px; }
  .leaf-badge{ width:44px; height:44px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow); }
  .leaf-badge svg{ width:22px; height:22px; stroke:var(--accent-ink); }
  header.top h1{ font-size:21px; margin:0 0 2px; font-weight:800; }
  header.top p{ margin:0; color:var(--ink-soft); font-size:12.5px; }
  .theme-btn{ border:1px solid var(--line); background:var(--bg-card); color:var(--ink-soft); border-radius:999px; padding:8px 14px; font-size:12px; cursor:pointer; flex-shrink:0; font-family:inherit; }

  /* hub switcher */
  .hub{ display:flex; gap:10px; margin-bottom:22px; }
  .hub button{
    flex:1; background:var(--bg-card); border:2px solid var(--line-soft); border-radius:var(--radius-lg);
    padding:16px 10px; cursor:pointer; font-family:inherit; text-align:center; box-shadow:var(--shadow);
  }
  .hub button .icon{ font-size:24px; display:block; margin-bottom:6px; }
  .hub button .lbl{ font-size:13.5px; font-weight:700; color:var(--ink); }
  .hub button.active{ border-color:var(--accent); background:var(--accent); }
  .hub button.active .lbl{ color:var(--accent-ink); }

  .view{ display:none; }
  .view.active{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .streak-box{ border-radius:var(--radius-lg); background:var(--bg-card); box-shadow:var(--shadow); border-inline-start:5px solid var(--accent); padding:18px 20px; display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
  .streak-num{ font-size:40px; font-weight:800; line-height:1; color:var(--accent); }
  .streak-label{ font-size:12.5px; color:var(--ink-soft); margin-top:5px; }
  .streak-edit{ font-size:12px; background:var(--bg-soft); border:none; border-radius:999px; color:var(--ink); cursor:pointer; padding:8px 14px; font-family:inherit; }

  .streak-row{ display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .streak-row .streak-box{ flex:1 1 150px; margin-bottom:0; padding:16px 18px; }
  .streak-row .streak-box .streak-num{ font-size:32px; }
  .streak-box.warm{ border-inline-start-color:var(--accent-warm); }
  .streak-box.warm .streak-num{ color:var(--accent-warm); }

  nav.tabs{ display:flex; gap:6px; margin-bottom:22px; overflow-x:auto; padding-bottom:2px; }
  nav.tabs button{ flex:1 1 auto; min-width:76px; background:var(--bg-card); color:var(--ink-soft); border:1px solid var(--line-soft); border-radius:var(--radius-md); padding:10px 6px; font-size:12px; cursor:pointer; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:5px; }
  nav.tabs button svg{ width:18px; height:18px; stroke:var(--ink-soft); }
  nav.tabs button.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  nav.tabs button.active svg{ stroke:var(--accent-ink); }

  section.panel{ display:none; }
  section.panel.active{ display:block; animation:fadeIn .25s ease; }

  .card{ background:var(--bg-card); border-radius:var(--radius-lg); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; }
  h2.section-title{ font-size:15px; margin:0 0 14px; font-weight:800; display:flex; align-items:center; gap:8px; }
  h2.section-title svg{ width:17px; height:17px; stroke:var(--accent); flex-shrink:0; }

  label{ display:block; font-size:12.5px; margin:16px 0 6px; color:var(--ink-soft); font-weight:500; }
  label:first-of-type{ margin-top:0; }
  input[type=text], input[type=date], input[type=number], textarea, select{ width:100%; background:var(--bg-soft); color:var(--ink); border:1px solid transparent; padding:11px 12px; font-size:14px; font-family:inherit; border-radius:var(--radius-sm); }
  textarea{ resize:vertical; min-height:70px; }
  input:focus, textarea:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .two-col{ display:flex; gap:10px; }
  .two-col > div{ flex:1; }

  .status-row{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .status-row button{ flex:1 1 auto; padding:11px 8px; border:1px solid var(--line-soft); background:var(--bg-soft); color:var(--ink); font-size:13px; cursor:pointer; min-width:100px; border-radius:var(--radius-md); font-family:inherit; }
  .status-row button.sel{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }
  .status-row button[data-val="انتكاسة"].sel{ background:var(--relapse); border-color:var(--relapse); }

  .plan-today{ border-radius:var(--radius-lg); background:var(--bg-soft); padding:18px; text-align:center; margin-bottom:16px; }
  .plan-today .num{ font-size:44px; font-weight:800; color:var(--accent-warm); line-height:1; }
  .plan-today .lbl{ font-size:13px; color:var(--ink-soft); margin-top:6px; }

  .stars{ display:flex; gap:8px; margin-top:8px; direction:ltr; justify-content:flex-end; }
  .stars button{ background:var(--bg-soft); border:1px solid transparent; width:40px; height:40px; font-size:16px; cursor:pointer; color:var(--ink-soft); border-radius:50%; font-family:inherit; }
  .stars button.on{ background:var(--accent-warm); color:#fff; }

  .btn-primary{ margin-top:22px; width:100%; padding:14px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-md); font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:var(--shadow); }
  .btn-secondary{ margin-top:10px; width:100%; padding:12px; background:var(--bg-soft); color:var(--ink); border:none; border-radius:var(--radius-md); font-size:13.5px; cursor:pointer; font-family:inherit; }

  .test-card{ border-radius:var(--radius-md); background:var(--bg-soft); padding:13px 14px; margin-bottom:10px; }
  .test-card .row1{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .test-card .name{ font-weight:700; font-size:14px; }
  .test-tag{ font-size:11px; padding:4px 10px; border-radius:999px; white-space:nowrap; font-weight:700; }
  .tag-ok{ background:#DCEEE4; color:#2F6650; }
  .tag-soon{ background:#F8E7C9; color:#8A5A12; }
  .tag-late{ background:#F5D9D5; color:#8C3A2F; }
  :root[data-theme="dark"] .tag-ok{ background:#20362C; color:#8FCBAE; }
  :root[data-theme="dark"] .tag-soon{ background:#3A2E17; color:#EAB963; }
  :root[data-theme="dark"] .tag-late{ background:#3A211C; color:#E8988A; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .tag-ok{ background:#20362C; color:#8FCBAE; }
    :root:not([data-theme="light"]) .tag-soon{ background:#3A2E17; color:#EAB963; }
    :root:not([data-theme="light"]) .tag-late{ background:#3A211C; color:#E8988A; }
  }
  .test-meta{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .del-link{ font-size:11.5px; color:var(--ink-soft); background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; margin-top:8px; font-family:inherit; }
  .add-test-form{ border:1.5px dashed var(--line); border-radius:var(--radius-lg); padding:14px; margin-top:16px; }

  .schedule-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px; }
  .schedule-row:last-child{ border-bottom:none; }
  .schedule-row.today{ font-weight:800; color:var(--accent); }
  .schedule-row .d{ color:var(--ink-soft); }

  .tip-box{ border-radius:var(--radius-lg); background:var(--bg-card); box-shadow:var(--shadow); padding:20px; margin-bottom:16px; min-height:70px; display:flex; align-items:center; gap:12px; font-size:14.5px; border-inline-start:5px solid var(--accent-warm); }
  .tip-box .spark{ flex-shrink:0; width:22px; height:22px; stroke:var(--accent-warm); }
  .tip-list{ list-style:none; padding:0; margin:0; }
  .tip-list li{ padding:12px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; display:flex; gap:10px; }
  .tip-list li:last-child{ border-bottom:none; }
  .tip-num{ font-weight:800; color:var(--accent); flex-shrink:0; }

  .log-entry{ border-radius:var(--radius-md); background:var(--bg-soft); padding:13px 14px; margin-bottom:10px; }
  .log-entry .row1{ display:flex; justify-content:space-between; align-items:center; }
  .log-entry .date{ font-weight:700; font-size:13.5px; }
  .log-entry .desc{ font-size:13px; margin-top:6px; }
  .log-entry .notes{ font-size:12px; margin-top:4px; color:var(--ink-soft); }
  .log-entry .stars-mini{ font-size:13px; letter-spacing:2px; direction:ltr; color:var(--accent-warm); }
  .log-entry .badge{ font-size:11px; padding:4px 10px; border-radius:999px; font-weight:700; }
  .badge-good{ background:#DCEEE4; color:#2F6650; }
  .badge-bad{ background:#F5D9D5; color:#8C3A2F; }
  :root[data-theme="dark"] .badge-good{ background:#20362C; color:#8FCBAE; }
  :root[data-theme="dark"] .badge-bad{ background:#3A211C; color:#E8988A; }
  .empty-msg{ color:var(--ink-soft); font-size:13px; padding:26px 0; text-align:center; }

  .health-notes-box{ margin-top:22px; }
  footer.note{ margin-top:30px; font-size:11.5px; color:var(--ink-soft); text-align:center; }

  .start-edit-row{ display:flex; gap:8px; margin-top:10px; }
  .start-edit-row input{ flex:1; }
  .start-edit-row button{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:var(--radius-sm); padding:0 16px; font-size:13px; cursor:pointer; font-family:inherit; }

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:999px;
    font-size:13.5px; box-shadow:0 4px 16px rgba(0,0,0,0.25); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:999; max-width:90%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="leaf-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c6-2 9-7 9-13a9 9 0 0 0-9 9c0-6-4-10-9-9 0 6 3 11 9 13Z"/></svg>
      </div>
      <div>
        <h1>متابعتي</h1>
        <p>الإقلاع عن الحشيش وتقليل التدخين، في مكان واحد</p>
      </div>
    </div>
    <button class="theme-btn" id="themeToggle">تبديل الوضع</button>
  </header>

  <div class="hub">
    <button id="hub-cannabis" class="active">
      <span class="icon">🌿</span>
      <span class="lbl">الإقلاع عن الحشيش</span>
    </button>
    <button id="hub-smoking">
      <span class="icon">🚬</span>
      <span class="lbl">تقليل التدخين</span>
    </button>
  </div>

  <!-- ============ CANNABIS VIEW ============ -->
  <div class="view active" id="view-cannabis">

    <div class="streak-box">
      <div>
        <div class="streak-num" id="cn-streakNum">0</div>
        <div class="streak-label">يوم متواصل بدون تعاطي</div>
      </div>
      <div>
        <button class="streak-edit" id="cn-editStartBtn">تعديل تاريخ البداية</button>
        <div class="start-edit-row" id="cn-startEditRow" style="display:none;">
          <input type="date" id="cn-startDateInput">
          <button id="cn-saveStartBtn" type="button">حفظ</button>
        </div>
      </div>
    </div>

    <nav class="tabs" id="cn-tabs">
      <button data-tab="daily" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        اليوم
      </button>
      <button data-tab="health">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        الصحة
      </button>
      <button data-tab="tips">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 2Z"/></svg>
        نصايح
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
        السجل
      </button>
    </nav>

    <section class="panel active" id="cn-panel-daily">
      <div class="card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        تسجيل اليوم
      </h2>
      <label for="cn-logDate">التاريخ</label>
      <input type="date" id="cn-logDate">
      <label>هل التزمت اليوم؟</label>
      <div class="status-row" id="cn-statusRow">
        <button data-val="نظيف" type="button">نظيف ✔</button>
        <button data-val="انتكاسة" type="button">حصلت انتكاسة</button>
        <button data-val="صعب بس صامد" type="button">صعب بس صامد</button>
      </div>
      <label for="cn-dayDesc">وصف اليوم</label>
      <textarea id="cn-dayDesc" placeholder="عدّي إزاي كان يومك، إيه اللي حصل، إيه اللي كان صعب أو كويس..."></textarea>
      <label>تقييم اليوم</label>
      <div class="stars" id="cn-starsRow">
        <button data-v="1" type="button">1</button><button data-v="2" type="button">2</button>
        <button data-v="3" type="button">3</button><button data-v="4" type="button">4</button>
        <button data-v="5" type="button">5</button>
      </div>
      <label for="cn-dayNotes">ملاحظات إضافية (مثلاً: أفكار، مؤثرات، حاجات لازم تتعمل)</label>
      <textarea id="cn-dayNotes" placeholder="أي ملاحظات حابب تسجلها..."></textarea>
      <button class="btn-primary" id="cn-saveLogBtn">حفظ تسجيل اليوم</button>
      </div>
    </section>

    <section class="panel" id="cn-panel-health">
      <div class="card">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
        التحاليل والمواعيد الدورية
      </h2>
      <div id="cn-testsList"></div>
      <div class="add-test-form">
        <label for="cn-testName">اسم التحليل / الكشف</label>
        <input type="text" id="cn-testName" placeholder="مثلاً: تحليل كبد، كشف دوري عند الطبيب...">
        <label for="cn-testDate">آخر مرة اتعمل فيها</label>
        <input type="date" id="cn-testDate">
        <label for="cn-testFreq">كل قد إيه لازم يتعاد؟ (بالأيام)</label>
        <input type="number" id="cn-testFreq" placeholder="مثلاً: 90" min="1">
        <button class="btn-secondary" id="cn-addTestBtn">إضافة تذكير</button>
      </div>
      </div>
      <div class="card health-notes-box">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 19.5Z"/></svg>
          ملاحظات صحية عامة
        </h2>
        <textarea id="cn-healthNotes" placeholder="أي حاجة عايز تسجلها عن صحتك العامة، أعراض، تعب، نوم، شهية..." style="min-height:110px;"></textarea>
        <button class="btn-secondary" id="cn-saveHealthBtn">حفظ الملاحظات</button>
      </div>
    </section>

    <section class="panel" id="cn-panel-tips">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 2Z"/></svg>
        نصيحة اليوم
      </h2>
      <div class="tip-box">
        <svg class="spark" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 1.8 5.5L19 9l-5.2 1.5L12 16l-1.8-5.5L5 9l5.2-1.5L12 2Z"/></svg>
        <span id="cn-tipOfDay"></span>
      </div>
      <button class="btn-secondary" id="cn-newTipBtn">نصيحة تانية</button>
      <h2 class="section-title" style="margin-top:26px;">كل النصايح</h2>
      <div class="card"><ul class="tip-list" id="cn-allTips"></ul></div>
    </section>

    <section class="panel" id="cn-panel-history">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
        سجل الأيام
      </h2>
      <div id="cn-historyList"></div>
    </section>
  </div>

  <!-- ============ SMOKING VIEW ============ -->
  <div class="view" id="view-smoking">

    <div class="streak-row">
      <div class="streak-box">
        <div class="streak-num" id="sm-cutNum">0</div>
        <div class="streak-label">سيجارة أقل من اللي كنت بتشربها يوميًا</div>
      </div>
      <div class="streak-box warm">
        <div class="streak-num" id="sm-dayNum">1</div>
        <div class="streak-label">يوم من بداية الخطة</div>
      </div>
    </div>

    <nav class="tabs" id="sm-tabs">
      <button data-tab="daily" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        اليوم
      </button>
      <button data-tab="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M12 7v5l4 2"/></svg>
